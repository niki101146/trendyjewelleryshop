{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>my website</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{% static 'css/style.css' %}" rel="stylesheet" >

<style>
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #f4f4f4;
        font-family: Georgia, serif;
        overflow-x: hidden; 
    }

    .page-title{
        text-align:center;
        margin-top:20px;
    }

    
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5%;
        background-color: rgb(212, 202, 157);
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .navbar div a {
        text-decoration: none;
        color: #333;
        margin-left: 15px;
        font-weight: bold;
    }

    
    #order-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px; 
        padding: 20px;
        width: 100%;
    }

    .order-card {
        background: white;
        width: 320px;
        max-width: 100%; 
        border-radius: 12px;
        text-align: center;
        padding: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .order-card img {
        width: 100%;
        height: 250px; 
        object-fit: cover;
        border-radius: 10px;
    }

    .order-card h3 {
        margin: 12px 0 5px;
        font-size: 22px;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
        color: #222;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
    }

    .remove-btn, .confirm-btn {
        background-color: rgb(235, 235, 165);
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 15px;
        transition: background 0.2s ease;
        margin: 5px;
    }

    .confirm-btn:hover, .remove-btn:hover {
        background-color: rgb(220, 220, 140);
    }

    
    /*MOBILE RESPONSIVE LAYOUT*/

    @media (max-width: 768px) {
        .navbar {
            flex-direction: column; 
            gap: 12px;
            text-align: center;
        }

        .navbar div {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .navbar div a {
            margin-left: 0;
            padding: 5px 8px;
            font-size: 15px;
        }

        h1 {
            font-size: 1.6rem; 
        }
    }
</style>
</head>
<body>
    <nav>
        <div class="navbar">
            <h1>Trendy</h1>
            <div>
                <a href="/">Home</a>
                <a href="{% url 'category' %}">Category</a>
                <a href="{% url 'cart' %}">Cart</a>
                <a href="{% url 'order' %}">Order</a>
                <a href="{% url 'about' %}">About</a>
            </div>
        </div>
    </nav>
<h1 class="page-title">📦 My Orders</h1>

<div id="order-list"></div>

<script>
let orders = JSON.parse(localStorage.getItem("orders")) || [];
let html = "";

if (orders.length === 0) {
    html = `
    <div style="text-align:center; padding: 40px 20px;">
        <h2>No orders found 📦</h2>
        <p style="color: #666; margin-top: 8px;">Place an order from the cart page.</p>
    </div>
    `;
} else {
    orders.forEach((order, index) => {
        html += `
        <div class="order-card">
            <img src="${order.image}" alt="${order.name}">
            <h3>${order.name}</h3>
            <p><strong class="price">${order.price}</strong></p>
            <p style="color: #666; font-size: 14px; margin-top: 5px;">Ordered on: ${order.date}</p>
            <div class="buttons">

                <button class="remove-btn" onclick="removeOrder(${index})">Cancel</button>
            </div>
        </div>
        `;
    });
}

document.getElementById("order-list").innerHTML = html;

function removeOrder(index){
    orders.splice(index, 1);
    localStorage.setItem("orders", JSON.stringify(orders));
    location.reload();
}
</script>

<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
