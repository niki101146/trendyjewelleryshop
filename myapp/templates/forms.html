{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Shopping</title>
     <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f4f4f4;
            font-family:Georgia, serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding: 10px;
        }

        .form-container{
            background:white;
            width: 100%;
            max-width: 450px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
            margin: 10px;
        }

        h2{
            color:rgb(212, 202, 157);
            margin-bottom: 20px; 
        }

        form p{
            margin-bottom:15px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:6px;
            color:#444;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:rgb(212, 202, 157);
            box-shadow:0 0 5px rgba(212,202,157,0.6);
        }

        button{
            width:100%;
            background:rgb(235, 235, 165);
            border:none;
            padding:12px;
            border-radius:25px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
            margin-top: 10px;
        }

        button:hover{
            background:rgb(220,220,140);
        }
    </style>
</head>
<body>
    <div class="form-container">
    <h2>📦 ORDER FORM</h2>

    <form method = "post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">confirm</button>
    </form>
    </div>

<script>
document.querySelector("form").addEventListener("submit", function () {

    let product = JSON.parse(localStorage.getItem("currentProduct"));

    if (product) {

        let orders = JSON.parse(localStorage.getItem("orders")) || [];

        orders.push({
            name: product.name,
            image: product.image,
            price: product.price,
            date: new Date().toLocaleString()
        });

        localStorage.setItem("orders", JSON.stringify(orders));

        localStorage.removeItem("currentProduct");
    }

});


document.querySelector("form").addEventListener("submit", function () {

    let product = JSON.parse(localStorage.getItem("currentProduct"));
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let index = localStorage.getItem("cartIndex");

    if (product) {

        let orders = JSON.parse(localStorage.getItem("orders")) || [];

        product.date = new Date().toLocaleDateString();

        orders.push(product);

        localStorage.setItem("orders", JSON.stringify(orders));

        if(index !== null){
            cart.splice(index,1);
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        localStorage.removeItem("currentProduct");
        localStorage.removeItem("cartIndex");
    }

});
</script>

</body>
</html>
