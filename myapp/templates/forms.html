<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping</title>
     <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f4f4f4;
            font-family:Georgia, serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .form-container{
            background:white;
            width:450px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
        }

        h2{
            color:rgb(212, 202, 157);
        }

        form p{
            margin-bottom:15px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:6px;
            color:#444;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:rgb(212, 202, 157);
            box-shadow:0 0 5px rgba(212,202,157,0.6);
        }

        button{
            width:100%;
            background:rgb(235, 235, 165);
            border:none;
            padding:12px;
            border-radius:25px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:rgb(220,220,140);
        }
    </style>
</head>
<body>
    <div class="form-container">
    <h2>📦 ORDER FORM</h2>

    <form method = "post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">confirm</button>
    </form>


    </div>
</body>
</html>
